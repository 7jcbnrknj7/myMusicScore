<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusicScore 我的曲谱</title><link rel="icon" href="/static/app.ico"><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><div class="brand"><i data-lucide="music-2"></i><strong>MusicScore</strong><span>个人曲谱客户端</span></div><div class="header-actions"><span id="health" class="status">正在连接</span><button id="settingsButton" title="设置"><i data-lucide="settings-2"></i></button></div></header>
<main>
<aside id="libraryPanel"><div class="section-heading"><h2>储存栏</h2><div class="sidebar-actions"><button id="refresh" title="刷新"><i data-lucide="refresh-cw"></i></button><button id="toggleLibraryPanel" type="button" title="收起储存栏" aria-label="收起储存栏" aria-expanded="true" aria-controls="library"><i data-lucide="panel-left-close"></i></button></div></div><input id="search" placeholder="搜索曲谱" aria-label="搜索曲谱"><div id="library"></div><footer><i data-lucide="hard-drive"></i><span id="libraryCount">0 首曲谱</span></footer></aside>
<section class="workspace">
<div class="upload-band"><div class="section-heading"><h2>新建转录</h2><span class="subtle" id="selectedFile">未选择文件</span></div><div class="upload-controls"><label class="file-button"><i data-lucide="file-up"></i>选择音频 / 视频 / 乐谱<input id="file" type="file" accept="audio/*,video/*,.mid,.midi,.musicxml,.xml,.mscz"></label><button id="record" title="麦克风录音"><i data-lucide="mic"></i>录音</button><div class="segmented" id="mode"><button class="active" data-mode="local"><i data-lucide="monitor"></i>本地</button><button data-mode="remote"><i data-lucide="cloud"></i>远程 API</button></div><label>模型<select id="model"><option>medium</option><option>small</option></select></label><button class="primary" id="transcribe"><i data-lucide="audio-lines"></i>开始</button></div><div id="recorder" hidden><span id="recordingState">录音中</span><time id="recordTime">00:00</time><meter id="micLevel" min="0" max="1" value="0" aria-label="麦克风音量"></meter><button id="pauseRecord" title="暂停录音"><i data-lucide="pause"></i></button><button id="stopRecord" title="停止录音"><i data-lucide="square"></i></button></div><div id="recordPreview" hidden><audio id="recordAudio" controls></audio><a id="saveRecording">下载录音</a><button id="discardRecord" title="丢弃本次录音"><i data-lucide="trash-2"></i></button></div><div class="instrument-row"><label>乐器<select id="instruments" multiple size="1" aria-label="乐器选择"></select></label><button id="instrumentToggle" title="展开乐器选择"><i data-lucide="list-music"></i></button><span id="task" role="status">就绪</span></div></div>
<div id="downloadMonitor" class="download-monitor" hidden role="status"></div>
<div id="empty" class="empty"><i data-lucide="notebook-tabs"></i><h2>你的曲谱库</h2><p>暂无已打开的曲谱</p></div>
<div id="editor" hidden><div class="score-heading"><div><h1 id="title"></h1><span id="scoreInfo" class="subtle"></span></div><button id="archive" title="移入回收目录"><i data-lucide="archive"></i></button></div>
<div class="toolbar"><label>声部<select id="part"><option value="">全部声部</option></select></label><button id="play" title="合成试听"><i data-lucide="play"></i></button><button id="stop" title="停止"><i data-lucide="square"></i></button><label class="speed">速度<input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="1"><output id="speedValue">1.00x</output></label><span class="divider"></span><label>移调<input id="semitones" type="number" min="-24" max="24" value="0"></label><button id="transpose" title="应用移调"><i data-lucide="arrow-up-down"></i></button><button id="chords"><i data-lucide="scan-line"></i>识别和弦</button><button id="musescore"><i data-lucide="external-link"></i>MuseScore</button><button id="sync" title="同步已保存的 MuseScore 编辑"><i data-lucide="refresh-cw"></i></button></div>
<div class="tabs"><button class="active" data-view="score">谱面</button><button data-view="notes">音符</button><button data-view="versions">版本</button><button data-view="assistant">AI 助手</button><div id="downloads"></div></div>
<section id="scoreView" class="view"><div class="notation-controls"><label class="score-file">谱式<select id="pdfFile"></select></label><button id="openNotation" title="在 MuseScore 中打开当前谱式"><i data-lucide="external-link"></i>打开谱式</button><a id="notationDownload" download>PDF</a></div><iframe id="pdf" title="曲谱预览"></iframe></section>
<section id="notesView" class="view" hidden><div class="table-wrap"><table><thead><tr><th>声部</th><th>拍点</th><th>音高</th><th>时值</th><th></th></tr></thead><tbody id="notes"></tbody></table></div><div id="noteCount" class="subtle"></div></section>
<section id="versionsView" class="view" hidden><div id="versions"></div></section>
<section id="assistantView" class="view" hidden><form id="ask"><textarea id="prompt" placeholder="输入编配或练习问题" required></textarea><button class="primary"><i data-lucide="send"></i>发送</button></form><pre id="answer"></pre></section>
</div></section>
<aside id="taskPanel" class="task-panel"><div class="section-heading"><h2>制作状态</h2><button id="toggleTaskPanel" type="button" title="收起状态栏" aria-label="收起状态栏" aria-expanded="true" aria-controls="taskList"><i data-lucide="panel-right-close"></i></button></div><div id="taskList" aria-live="polite"></div></aside>
</main>
<dialog id="settings"><form id="settingsForm">
<div class="section-heading"><h2>设置</h2><button type="button" id="closeSettings" title="关闭"><i data-lucide="x"></i></button></div>
<fieldset><legend>本机路径</legend><input type="hidden" name="musescore"><div class="path-settings">
<label>应用安装目录<span class="path-picker"><input name="install_dir" readonly><button type="button" id="openInstallDir" title="打开应用安装目录"><i data-lucide="folder-open"></i></button></span></label>
<label>乐谱导出位置<span class="path-picker"><input name="export_dir" required><button type="button" id="chooseExportDir" title="选择乐谱导出文件夹"><i data-lucide="folder-search"></i></button></span></label>
</div></fieldset>
<fieldset><legend>本地模型</legend><label>Hugging Face Token<input type="password" name="hf_token" autocomplete="off" placeholder="Windows 凭据管理器保存"></label><div class="settings-actions"><a href="https://huggingface.co/MuScriptor/muscriptor-medium" target="_blank" rel="noreferrer">medium 访问许可</a><a href="https://huggingface.co/MuScriptor/muscriptor-small" target="_blank" rel="noreferrer">small 访问许可</a></div>
<div class="model-download-row"><div class="download-status-heading"><strong>medium</strong><span id="mediumState">未下载</span><button type="button" data-download="medium"><i data-lucide="download"></i>下载</button></div><progress id="mediumProgress" max="100" aria-label="medium 模型下载进度" hidden></progress><span id="mediumProgressText" class="download-detail" hidden></span></div>
<div class="model-download-row"><div class="download-status-heading"><strong>small</strong><span id="smallState">未下载</span><button type="button" data-download="small"><i data-lucide="download"></i>下载</button></div><progress id="smallProgress" max="100" aria-label="small 模型下载进度" hidden></progress><span id="smallProgressText" class="download-detail" hidden></span></div>
<div class="model-download-row"><div class="download-status-heading"><strong>large</strong><span id="largeState">未下载</span><button type="button" data-download="large"><i data-lucide="download"></i>下载</button></div><progress id="largeProgress" max="100" aria-label="large 模型下载进度" hidden></progress><span id="largeProgressText" class="download-detail" hidden></span></div>
<div class="settings-actions"><a href="https://huggingface.co/MuScriptor/muscriptor-large" target="_blank" rel="noreferrer">large 访问许可</a></div>
</fieldset>
<fieldset><legend>远程 MuScriptor</legend><label>small 服务地址<input name="remote_small" type="url" placeholder="https://your-small-server"></label><label>medium 服务地址<input name="remote_medium" type="url" placeholder="https://your-medium-server"></label><label>large 服务地址<input name="remote_large" type="url" placeholder="https://your-large-server"></label><label>服务密钥<input type="password" name="remote_key" autocomplete="off"></label></fieldset>
<fieldset><legend>AI 助手</legend><label>提供商<select name="provider" id="provider"><option value="openai">OpenAI / ChatGPT API</option><option value="deepseek">DeepSeek</option><option value="custom">OpenAI 兼容接口</option></select></label><label>API 地址<input name="llm_url" type="url" required></label><label>模型 ID<input name="llm_model" placeholder="填写账号可用的模型 ID"></label><label>API Key<input name="llm_key" type="password" autocomplete="off"></label></fieldset>
<div class="settings-actions"><span id="settingsStatus" role="status"></span><button class="primary" type="submit"><i data-lucide="save"></i>保存</button></div></form></dialog>
<dialog id="noteDialog"><form id="noteForm"><h2>修改音符</h2><label>MIDI 音高<input id="notePitches" required pattern="[0-9, ]+"></label><label>时值 / 拍<input id="noteDuration" type="number" min="0.03125" max="32" step="0.03125" required></label><div class="settings-actions"><button type="button" id="cancelNote">取消</button><button type="submit" class="primary"><i data-lucide="save"></i>保存新版本</button></div></form></dialog>
<div id="toast" role="alert" hidden></div><script src="/static/lucide.js"></script><script src="/static/app.js"></script>
</body></html>
